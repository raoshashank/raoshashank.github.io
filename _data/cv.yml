- title: Experience
  type: time_table
  contents:
    - title: Ph.D. Researcher (Embodied AI)
      institution: National University of Singapore
      location: Singapore
      year: 2021 - Present
      description:
        - title: "Language-Driven Scenario Generation for Social Navigation"
          contents:
            - "Developed an LLM-powered pipeline that translates natural language descriptions into executable human-robot interactive testing scenarios, reducing scenario synthesis time to ~1 minute, and compared three planners in a 160-participant case study. [Under Review: IEEE RAL] (<a href='https://arxiv.org/html/2412.19595v1' target='_blank'>Paper</a>, <a href='https://github.com/clear-nus/SocRATES' target='_blank'>Code</a>)"
        - title: "Largest Expert Demonstration Social Navigation Dataset"
          contents:
            - "Co-led an eight-team open-source social navigation dataset collection effort (29.5 hours of onboard robot data from 7 robots across 5 countries, 43.5 hours BEV data). Independently analyzed multimodal onboard sensor data and benchmarked foundational models. [Under Review: IJRR] (<a href='https://raoshashank.github.io/acme-socnav-dataset/' target='_blank'>Website</a>)"
        - title: "Learning Residual Social Corrections for Navigation Policies"
          contents:
            - "Designed and trained sample-efficient end-to-end and residual imitation-learning social navigation policies using abstract representations to reduce the sim-to-real gap, iterating on architectures and training paradigms through scenario-based testing. (Ongoing Work)"
    - title: Research Assistant
      institution: Autonomous Agents and Intelligent Systems Lab
      location: Tempe, AZ, USA
      year: 2020 - 2021
      description:
        - "Conducted practical experiments to test an AI action-model learning algorithm in game-based environments. (<a href='https://aair-lab.github.io/Publications/vms_aaai21.pdf' target='_blank'>Paper</a>)"
        - "Engineered a robot demo using ROS, OpenRAVE, AutoCAD, and Fusion 360 to demonstrate robots assisting humans in the assembly of automotive parts (NSF-Funded Project). (<a href='https://youtu.be/Wk6ymTzDUF0' target='_blank'>Demo</a>)"
    - title: Robotics Intern
      institution: Toyota Material Handling
      location: Remote — Columbus, IN, USA
      year: 2020
      description:
        - Implemented a LiDAR sensor fusion ROS2 package for autonomous forklifts and deployed it in simulation using Docker.
    - title: Research Intern
      institution: Indian Institute of Technology, Kanpur
      location: Kanpur, India
      year: 2018
      description:
        - "Generated a ROS/Gazebo dataset and trained TensorFlow models to approximate a robotic-arm inverse-kinematics solver, achieving 98% test accuracy. Investigated RNNs and LSTMs for motion planning. (<a href='https://github.com/raoshashank/RNN_for_Motion_Planning' target='_blank'>Code</a>)"
    - title: Research Intern
      institution: Indian Institute of Technology, Bombay
      location: Mumbai, India
      year: 2017
      description:
        - "Simulated a decentralized multi-robot graph-based exploration algorithm using Gazebo and ROS, and achieved complete coverage of random maze environments. (<a href='https://github.com/raoshashank/Multi-Robot-Decentralized-Graph-Exploration' target='_blank'>Code</a>)"

