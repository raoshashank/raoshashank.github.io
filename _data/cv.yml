- title: Professional Summary
  type: text
  contents: >
    Robotics researcher and Ph.D. candidate specializing in social robot navigation,
    embodied AI, scenario-based testing, and imitation learning. Experienced in curating
    and analyzing large-scale datasets, training machine learning models for robotic
