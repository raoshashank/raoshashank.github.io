- title: Selected Projects
  type: time_table
  contents:
    - title: Object pose hallucination for object search under full occlusion
      description:
        - "Investigated 6-DoF fully-occluded object pose estimation in cluttered scenes with diffusion models, and a differentiable-rendering loss-guidance signal that steers sampling towards observation-consistent poses. (<a href='https://github.com/raoshashank/rpdiff_object_search' target='_blank'>Code</a>)"
    - title: Explanation Generation in Human-Robot Teaming
      description:
        - "Implemented a framework that uses inverse reinforcement learning to learn the preferred order of explanations provided by an AI agent to humans, to minimize the cognitive load in collaborative tasks. Designed human-study experiments (Amazon MTurk) to evaluate the proposed algorithm. (<a href='https://github.com/mehrdadzakershahrak/Inverse_Reinforcement_Learning_on_Planning' target='_blank'>Code</a>)"
    - title: "ABU-Robocon NITK"
      description:
        - "Designed, developed, prototyped, fabricated, and assembled (as a team) two robots that play a cooperative game of shuttlecock throwing; became the university's first team to qualify for the national round. (<a href='https://robocon.nitk.ac.in/' target='_blank'>Link</a>)"
    - title: Learning robotic snake locomotion using Genetic Algorithms
      description:
        - "Created a framework that uses genetic algorithms to mimic snake motion from a video onto a snake robot simulated in CoppeliaSim. (<a href='https://github.com/raoshashank/ARL_Project' target='_blank'>Code</a>)"

